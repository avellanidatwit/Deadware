services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: deadware
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DEADWARE_APP_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DEADWARE_MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deadware-postgres:/var/lib/postgresql/data
      - ./server/database/init.sh:/docker-entrypoint-initdb.d/01-deadware.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deadware"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  deadware-postgres:
