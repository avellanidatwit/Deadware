name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up native PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE deadware_test LOGIN PASSWORD 'test-password';"
          sudo -u postgres createdb --owner=deadware_test deadware_test
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://deadware_test:test-password@localhost:5432/deadware_test
      - run: npm run build:client
